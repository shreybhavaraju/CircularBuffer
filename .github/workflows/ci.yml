name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
          - os: ubuntu-latest
            cxx: clang++
          - os: macos-latest
            cxx: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tests
        run: make test CXX=${{ matrix.cxx }}
      - name: tests under asan + ubsan
        if: runner.os == 'Linux'
        run: make sanitize CXX=${{ matrix.cxx }}
